name: Update Streak Stats

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SVG'yi indir
        run: |
          mkdir -p assets
          curl -sL "https://github-readme-streak-stats-x750.onrender.com/?user=ibovibo&theme=gruvbox&hide_border=true" -o assets/streak-stats.svg

      - name: Değişiklik varsa bot ile commit at
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg
          git diff --staged --quiet || git commit -m "chore: streak stats güncellendi"
          git push
