<svg viewBox="0 0 760 215" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1F14"/>
      <stop offset="100%" stop-color="#1D0A14"/>
    </linearGradient>
    <linearGradient id="pinkGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8447F"/>
      <stop offset="100%" stop-color="#1B5E3A"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="760" height="215" rx="18" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="757" height="212" rx="17" fill="none" stroke="url(#pinkGreen)" stroke-width="1.6" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Fira Code, monospace" font-size="19" fill="#DCE0DE">
    <text x="40" y="52">I'm an Artificial Intelligence Engineering student with a</text>
    <text x="40" y="84">strong interest in data science and machine learning. I'm</text>
    <text x="40" y="116">passionate about building AI-powered solutions for real-world</text>
    <text x="40" y="148">problems, and I see every project I work on as an opportunity</text>
    <text x="40" y="180">to grow both my technical expertise and design skills.</text>
  </g>
</svg>
