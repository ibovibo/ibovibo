<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1F14"/>
      <stop offset="100%" stop-color="#1D0A14"/>
    </linearGradient>
    <linearGradient id="pinkGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8447F"/>
      <stop offset="100%" stop-color="#1B5E3A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="760" height="220" rx="18" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="757" height="217" rx="17" fill="none" stroke="url(#pinkGreen)" stroke-width="1.6" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="40" y="42" font-family="Fira Code, monospace" font-size="16" font-weight="600" fill="#E8447F" letter-spacing="3">
    ABOUT ME
    <animate attributeName="fill" values="#E8447F;#4CAF7D;#E8447F" dur="4s" repeatCount="indefinite"/>
  </text>
  <line x1="40" y1="54" x2="200" y2="54" stroke="url(#pinkGreen)" stroke-width="2"/>

  <g font-family="Fira Code, monospace" font-size="15" fill="#DCE0DE">
    <text x="40" y="88">I'm an Artificial Intelligence Engineering student with a</text>
    <text x="40" y="112">strong interest in data science and machine learning. I'm</text>
    <text x="40" y="136">passionate about building AI-powered solutions for real-world</text>
    <text x="40" y="160">problems, and I see every project I work on as an opportunity</text>
    <text x="40" y="184">to grow both my technical expertise and design skills.</text>
  </g>
</svg>
